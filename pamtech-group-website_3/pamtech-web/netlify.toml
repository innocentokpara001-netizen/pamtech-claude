# The Next.js runtime is declared EXPLICITLY. Netlify detects Next.js by
# looking for package.json at the repository ROOT — this project sits in a
# subdirectory, so detection silently fails, no runtime attaches, and the
# deploy succeeds while serving a 404 for every route.
#
# Do NOT add a catch-all redirect to /index.html. That is for static
# exports; with the App Router it bypasses the runtime entirely.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
