# Netlify picks up the Next.js runtime automatically — it does not need to
# be declared here, and pinning it is discouraged because the adapter is
# updated to track new Next.js releases.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Security headers. Cheap to set, and there is no reason a brochure site
# should be embeddable in someone else's frame.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
